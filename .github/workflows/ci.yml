name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Next.js app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - name: liveAgent types match openapi.json
        run: |
          npx openapi-typescript liveAgent/openapi.json -o lib/liveAgent.types.ts --default-non-nullable false
          git diff --exit-code lib/liveAgent.types.ts || (echo "::error::lib/liveAgent.types.ts is stale. Run: npm run agent:types" && exit 1)
      # No secrets: the build must work without Supabase or liveAgent configured.
      - run: npm run build

  database:
    name: Supabase (migrations, RLS, end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Applies every migration in supabase/migrations to a fresh local database.
      - run: supabase start
      - name: Row-level security tests
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_TEST_URL="$API_URL"
          export SUPABASE_TEST_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          export SUPABASE_TEST_SECRET_KEY="${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          npx vitest run supabase/tests
      # M2-Org end to end (plans/m2-org.md O.7): builds the app, runs it against this local
      # database with a stub liveAgent (no Gemini), and drives it with Playwright.
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_TEST_URL="$API_URL"
          export SUPABASE_TEST_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          export SUPABASE_TEST_SECRET_KEY="${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  live-agent:
    name: liveAgent (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: liveAgent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: liveAgent/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest
      - name: openapi.json matches the code
        run: |
          python scripts/export_openapi.py
          git diff --exit-code openapi.json || (echo "::error::liveAgent/openapi.json is stale. Run: npm run agent:types" && exit 1)
